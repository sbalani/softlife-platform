name: Huaxin fleet sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run full fleet sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://softlife-platform.vercel.app/api/cron/huaxin-sync
